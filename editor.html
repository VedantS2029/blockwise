const rev=x=>x.map(st=>{const b=Array.isArray(st)?st:st&&st.b;if(!Array.isArray(b)||!b.length||!b.every(okb))return null;if(!Array.isArray(st)&&isFinite(st.x)&&isFinite(st.y)){b.x=+st.x;b.y=+st.y}return b}).filter(Boolean);
try{const j=JSON.parse(BCA_LOAD()||'null');if(j){
 if(Array.isArray(j.c))j.c.forEach(o=>{const c=ALL.find(x=>x.id==o.id);if(c&&!SP.includes(c)&&Array.isArray(o.s)){c.scripts=rev(o.s);SP.push(c)}});
 else if(Array.isArray(j.s))j.s.forEach((x,i)=>{const c=ALL[i];if(c&&Array.isArray(x)&&x.length){c.scripts=rev(x);SP.push(c)}});
 if(Array.isArray(j.vars))j.vars.forEach(k=>{if(typeof k=='string'&&/^\w{1,12}$/.test(k)&&!VN.includes(k)){VN.push(k);V[k]=0}});
 done=j.done||[];L=cl(j.L|0,0,LES.length-1);cur=SP[j.cur>=0?j.cur:0]||null}}catch(e){}
